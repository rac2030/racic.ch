<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <g transform="translate(400,180)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="0" cy="0" r="25" fill="url(#accent)" opacity="0.2"/>
    <g stroke="url(#accent)" stroke-width="2" fill="none">
      <circle cx="0" cy="-80" r="15"/>
      <circle cx="69" cy="-40" r="15"/>
      <circle cx="69" cy="40" r="15"/>
      <circle cx="0" cy="80" r="15"/>
      <circle cx="-69" cy="40" r="15"/>
      <circle cx="-69" cy="-40" r="15"/>
    </g>
    <g stroke="url(#accent)" stroke-width="1.5" opacity="0.6">
      <line x1="0" y1="-40" x2="0" y2="-65"/>
      <line x1="35" y1="-20" x2="54" y2="-33"/>
      <line x1="35" y1="20" x2="54" y2="33"/>
      <line x1="0" y1="40" x2="0" y2="65"/>
      <line x1="-35" y1="20" x2="-54" y2="33"/>
      <line x1="-35" y1="-20" x2="-54" y2="-33"/>
    </g>
    <g stroke="url(#accent)" stroke-width="1" opacity="0.4">
      <line x1="0" y1="-65" x2="54" y2="-33"/>
      <line x1="54" y1="-33" x2="54" y2="33"/>
      <line x1="54" y1="33" x2="0" y2="65"/>
      <line x1="0" y1="65" x2="-54" y2="33"/>
      <line x1="-54" y1="33" x2="-54" y2="-33"/>
      <line x1="-54" y1="-33" x2="0" y2="-65"/>
    </g>
  </g>
  <text x="400" y="320" text-anchor="middle" font-family="Source Sans Pro, sans-serif" font-size="36" font-weight="900" fill="white" letter-spacing="-1">Backstage</text>
  <text x="400" y="350" text-anchor="middle" font-family="Source Sans Pro, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" letter-spacing="2">INTERNAL DEVELOPER PORTAL FRAMEWORK</text>
</svg>
