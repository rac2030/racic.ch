<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="error" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glowError" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="950" cy="160" r="150" fill="url(#glow)"/>
  <circle cx="950" cy="160" r="100" fill="url(#glowError)"/>
  <!-- Font/Grid pattern background -->
  <g opacity="0.04" fill="none" stroke="url(#accent)" stroke-width="1">
    <line x1="100" y1="40" x2="100" y2="280"/>
    <line x1="140" y1="40" x2="140" y2="280"/>
    <line x1="180" y1="40" x2="180" y2="280"/>
    <line x1="220" y1="40" x2="220" y2="280"/>
    <line x1="260" y1="40" x2="260" y2="280"/>
    <line x1="300" y1="40" x2="300" y2="280"/>
    <line x1="60" y1="60" x2="340" y2="60"/>
    <line x1="60" y1="100" x2="340" y2="100"/>
    <line x1="60" y1="140" x2="340" y2="140"/>
    <line x1="60" y1="180" x2="340" y2="180"/>
    <line x1="60" y1="220" x2="340" y2="220"/>
    <line x1="60" y1="260" x2="340" y2="260"/>
  </g>
  <!-- Broken monospace characters showing the issue -->
  <g transform="translate(200,160)">
    <!-- Correct monospace rendering -->
    <text x="-100" y="-20" text-anchor="middle" font-family="'Ubuntu Mono', 'Courier New', monospace" font-size="28" fill="rgba(255,255,255,0.3)" letter-spacing="0">12345</text>
    <text x="-100" y="10" text-anchor="middle" font-family="'Ubuntu Mono', 'Courier New', monospace" font-size="28" fill="rgba(255,255,255,0.3)" letter-spacing="0">ABCDE</text>
    <text x="-100" y="55" text-anchor="middle" font-family="'Source Sans Pro', sans-serif" font-size="11" fill="rgba(255,255,255,0.25)" letter-spacing="1">CORRECT</text>
    <!-- Arrow showing transformation -->
    <path d="M-40,0 L40,0" stroke="url(#accent)" stroke-width="2" marker-end="url(#arrowhead)"/>
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="url(#accent)"/>
      </marker>
    </defs>
    <!-- Broken/emoji substituted rendering -->
    <text x="100" y="-20" text-anchor="middle" font-family="'Noto Color Emoji', sans-serif" font-size="28" fill="url(#error)" letter-spacing="8">12345</text>
    <text x="100" y="10" text-anchor="middle" font-family="'Noto Color Emoji', sans-serif" font-size="28" fill="url(#error)" letter-spacing="8">ABCDE</text>
    <text x="100" y="55" text-anchor="middle" font-family="'Source Sans Pro', sans-serif" font-size="11" fill="rgba(255,255,255,0.25)" letter-spacing="1">BROKEN</text>
  </g>
  <!-- Emoji icon representing the culprit -->
  <g transform="translate(950,160)">
    <rect x="-50" y="-50" width="100" height="100" rx="16" fill="none" stroke="url(#error)" stroke-width="4"/>
    <text x="0" y="12" text-anchor="middle" font-size="56">🏷️</text>
  </g>
  <text x="840" y="148" text-anchor="end" font-family="'Source Sans Pro', sans-serif" font-size="42" font-weight="900" fill="white" letter-spacing="-1">Font Rendering Fix</text>
  <text x="840" y="188" text-anchor="end" font-family="'Source Sans Pro', sans-serif" font-size="15" fill="rgba(255,255,255,0.6)" letter-spacing="2.5">UBUNTU FONTCONFIG EMOJI SUBSTITUTION</text>
</svg>
