<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="950" cy="160" r="150" fill="url(#glow)"/>
  <g transform="translate(320,160)" opacity="0.06" fill="none" stroke="url(#accent)"><circle cx="0" cy="0" r="52"/></g>
  <g transform="translate(950,160)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#accent)" stroke-width="5"/>
    <ellipse cx="0" cy="0" rx="60" ry="26" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="26" ry="60" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.7"/>
    <circle cx="0" cy="-60" r="6" fill="url(#accent)"/>
    <circle cx="60" cy="0" r="6" fill="url(#accent)"/>
    <circle cx="-60" cy="0" r="6" fill="url(#accent)"/></g>
  <text x="840" y="148" text-anchor="end" font-family="'Source Sans Pro', sans-serif" font-size="42" font-weight="900" fill="white" letter-spacing="-1">360° Video Processing</text>
  <text x="840" y="188" text-anchor="end" font-family="'Source Sans Pro', sans-serif" font-size="15" fill="rgba(255,255,255,0.6)" letter-spacing="2.5">FISH-EYE ACTION-CAM LINKS</text>
