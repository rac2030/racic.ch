<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121e"/>
      <stop offset="50%" stop-color="#0d1f30"/>
      <stop offset="100%" stop-color="#0a121e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#348cb2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#348cb2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#348cb2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#348cb2" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="blur1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#348cb2" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.06" stroke="#348cb2" stroke-width="0.5">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Horizontal glow line -->
  <rect x="0" y="310" width="1200" height="2" fill="url(#glow)"/>

  <!-- Left side: Code editor panel -->
  <g transform="translate(80, 100)" filter="url(#shadow)">
    <rect width="480" height="420" rx="8" fill="#0d1a28" stroke="rgba(120,180,220,0.3)" stroke-width="1"/>
    <!-- Title bar -->
    <rect width="480" height="32" rx="8" fill="#0f2035"/>
    <rect y="24" width="480" height="8" fill="#0f2035"/>
    <circle cx="16" cy="16" r="5" fill="#ff5f57"/>
    <circle cx="34" cy="16" r="5" fill="#febc2e"/>
    <circle cx="52" cy="16" r="5" fill="#28c840"/>
    <text x="200" y="20" font-family="monospace" font-size="11" fill="#7dd3fc" text-anchor="middle" opacity="0.6">opencode-chat.ts</text>

    <!-- Code lines with syntax highlighting -->
    <text x="16" y="60" font-family="monospace" font-size="13">
      <tspan fill="#7c3aed">import</tspan><tspan fill="#f0f4f8"> { </tspan><tspan fill="#7dd3fc">Agent</tspan><tspan fill="#f0f4f8"> } </tspan><tspan fill="#7c3aed">from</tspan><tspan fill="#a5d6ff"> 'opencode'</tspan>
    </text>
    <text x="16" y="82" font-family="monospace" font-size="13">
      <tspan fill="#7c3aed">import</tspan><tspan fill="#f0f4f8"> { </tspan><tspan fill="#7dd3fc">readFile</tspan><tspan fill="#f0f4f8">, </tspan><tspan fill="#7dd3fc">writeFile</tspan><tspan fill="#f0f4f8"> } </tspan><tspan fill="#7c3aed">from</tspan><tspan fill="#a5d6ff"> 'fs/promises'</tspan>
    </text>
    <text x="16" y="104" font-family="monospace" font-size="13" fill="#f0f4f8"/>
    <text x="16" y="126" font-family="monospace" font-size="13">
      <tspan fill="#7c3aed">const</tspan><tspan fill="#7dd3fc"> agent</tspan><tspan fill="#f0f4f8"> = </tspan><tspan fill="#7c3aed">new</tspan><tspan fill="#7dd3fc"> Agent</tspan><tspan fill="#f0f4f8">(</tspan>
    </text>
    <text x="16" y="148" font-family="monospace" font-size="13">
      <tspan fill="#f0f4f8">  model: </tspan><tspan fill="#a5d6ff">'anthropic/claude-sonnet'</tspan><tspan fill="#f0f4f8">,</tspan>
    </text>
    <text x="16" y="170" font-family="monospace" font-size="13">
      <tspan fill="#f0f4f8">  tools: [</tspan><tspan fill="#7dd3fc">FileTool</tspan><tspan fill="#f0f4f8">, </tspan><tspan fill="#7dd3fc">ShellTool</tspan><tspan fill="#f0f4f8">, </tspan><tspan fill="#7dd3fc">WebFetchTool</tspan><tspan fill="#f0f4f8">]</tspan>
    </text>
    <text x="16" y="192" font-family="monospace" font-size="13" fill="#f0f4f8">)</text>
    <text x="16" y="214" font-family="monospace" font-size="13" fill="#f0f4f8"/>
    <text x="16" y="236" font-family="monospace" font-size="13">
      <tspan fill="#7c3aed">const</tspan><tspan fill="#7dd3fc"> response</tspan><tspan fill="#f0f4f8"> = </tspan><tspan fill="#7c3aed">await</tspan><tspan fill="#f0f4f8"> agent.</tspan><tspan fill="#7dd3fc">chat</tspan><tspan fill="#f0f4f8">(</tspan>
    </text>
    <text x="16" y="258" font-family="monospace" font-size="13">
      <tspan fill="#a5d6ff">'Build a portfolio blog with Astro'</tspan>
    </text>
    <text x="16" y="280" font-family="monospace" font-size="13" fill="#f0f4f8">)</text>
    <text x="16" y="302" font-family="monospace" font-size="13" fill="#f0f4f8"/>
    <text x="16" y="324" font-family="monospace" font-size="13">
      <tspan fill="#7c3aed">await</tspan><tspan fill="#f0f4f8"> </tspan><tspan fill="#7dd3fc">writeFile</tspan><tspan fill="#f0f4f8">(</tspan><tspan fill="#a5d6ff">'src/pages/index.astro'</tspan><tspan fill="#f0f4f8">, response.code)</tspan>
    </text>

    <!-- Cursor blink -->
    <rect x="16" y="338" width="8" height="16" fill="#348cb2" opacity="0.8">
      <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Right side: AI Brain / Neural network -->
  <g transform="translate(640, 120)">
    <!-- Central brain circle -->
    <circle cx="280" cy="190" r="80" fill="none" stroke="#348cb2" stroke-width="1.5" opacity="0.3"/>
    <circle cx="280" cy="190" r="60" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.2"/>
    <circle cx="280" cy="190" r="40" fill="rgba(52,140,178,0.1)" stroke="#348cb2" stroke-width="1" opacity="0.5"/>

    <!-- Brain icon (simplified) -->
    <g transform="translate(255, 165)" opacity="0.8">
      <path d="M0,25 C0,10 10,0 25,0 C40,0 50,10 50,25 C55,20 60,25 60,32 C60,40 55,45 50,42 C50,50 40,55 30,55 C20,55 10,50 8,42 C3,45 0,40 0,32 C0,25 -5,20 0,25Z" fill="none" stroke="#7dd3fc" stroke-width="1.5"/>
    </g>

    <!-- Neural network nodes -->
    <g opacity="0.6">
      <!-- Input layer -->
      <circle cx="140" cy="100" r="6" fill="#348cb2"/>
      <circle cx="140" cy="150" r="6" fill="#348cb2"/>
      <circle cx="140" cy="200" r="6" fill="#348cb2"/>
      <circle cx="140" cy="250" r="6" fill="#348cb2"/>
      <circle cx="140" cy="300" r="6" fill="#348cb2"/>

      <!-- Hidden layer 1 -->
      <circle cx="220" cy="120" r="6" fill="#7dd3fc"/>
      <circle cx="220" cy="170" r="6" fill="#7dd3fc"/>
      <circle cx="220" cy="220" r="6" fill="#7dd3fc"/>
      <circle cx="220" cy="270" r="6" fill="#7dd3fc"/>

      <!-- Hidden layer 2 -->
      <circle cx="340" cy="120" r="6" fill="#7dd3fc"/>
      <circle cx="340" cy="170" r="6" fill="#7dd3fc"/>
      <circle cx="340" cy="220" r="6" fill="#7dd3fc"/>
      <circle cx="340" cy="270" r="6" fill="#7dd3fc"/>

      <!-- Output layer -->
      <circle cx="420" cy="150" r="6" fill="#348cb2"/>
      <circle cx="420" cy="200" r="6" fill="#348cb2"/>
      <circle cx="420" cy="250" r="6" fill="#348cb2"/>
    </g>

    <!-- Connections -->
    <g stroke="#348cb2" stroke-width="0.5" opacity="0.2">
      <!-- Input to Hidden 1 -->
      <line x1="146" y1="100" x2="214" y2="120"/><line x1="146" y1="100" x2="214" y2="170"/>
      <line x1="146" y1="150" x2="214" y2="120"/><line x1="146" y1="150" x2="214" y2="170"/><line x1="146" y1="150" x2="214" y2="220"/>
      <line x1="146" y1="200" x2="214" y2="170"/><line x1="146" y1="200" x2="214" y2="220"/><line x1="146" y1="200" x2="214" y2="270"/>
      <line x1="146" y1="250" x2="214" y2="220"/><line x1="146" y1="250" x2="214" y2="270"/>
      <line x1="146" y1="300" x2="214" y2="270"/>
      <!-- Hidden 1 to Hidden 2 -->
      <line x1="226" y1="120" x2="334" y2="120"/><line x1="226" y1="120" x2="334" y2="170"/>
      <line x1="226" y1="170" x2="334" y2="120"/><line x1="226" y1="170" x2="334" y2="170"/><line x1="226" y1="170" x2="334" y2="220"/>
      <line x1="226" y1="220" x2="334" y2="170"/><line x1="226" y1="220" x2="334" y2="220"/><line x1="226" y1="220" x2="334" y2="270"/>
      <line x1="226" y1="270" x2="334" y2="220"/><line x1="226" y1="270" x2="334" y2="270"/>
      <!-- Hidden 2 to Output -->
      <line x1="346" y1="120" x2="414" y2="150"/><line x1="346" y1="120" x2="414" y2="200"/>
      <line x1="346" y1="170" x2="414" y2="150"/><line x1="346" y1="170" x2="414" y2="200"/><line x1="346" y1="170" x2="414" y2="250"/>
      <line x1="346" y1="220" x2="414" y2="200"/><line x1="346" y1="220" x2="414" y2="250"/>
      <line x1="346" y1="270" x2="414" y2="250"/>
    </g>

    <!-- Data flow particles -->
    <g fill="#7dd3fc">
      <circle r="2" opacity="0.8">
        <animateMotion dur="3s" repeatCount="indefinite" path="M140,100 L220,120 L340,120 L420,150"/>
      </circle>
      <circle r="2" opacity="0.6">
        <animateMotion dur="4s" repeatCount="indefinite" path="M140,200 L220,170 L340,170 L420,200"/>
      </circle>
      <circle r="2" opacity="0.7">
        <animateMotion dur="3.5s" repeatCount="indefinite" path="M140,300 L220,270 L340,270 L420,250"/>
      </circle>
    </g>
  </g>

  <!-- Title text -->
  <text x="600" y="520" font-family="'Source Sans Pro', sans-serif" font-size="36" font-weight="700" fill="#f0f4f8" text-anchor="middle" filter="url(#shadow)">
    Building This Site with AI
  </text>
  <text x="600" y="555" font-family="'Source Sans Pro', sans-serif" font-size="18" fill="#7dd3fc" text-anchor="middle" opacity="0.8">
    OpenCode x Astro x GitHub Actions
  </text>

  <!-- Bottom accent line -->
  <rect x="400" y="575" width="400" height="2" rx="1" fill="url(#glow)"/>
</svg>