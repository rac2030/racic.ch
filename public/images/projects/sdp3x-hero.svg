<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pcb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d5a27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3d1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#00d4ff" stroke-width="0.5">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
  </g>

  <!-- PCB board -->
  <g filter="url(#shadow)">
    <rect x="200" y="100" width="400" height="200" rx="8" fill="url(#pcb)" stroke="#4a8a42" stroke-width="2"/>

    <!-- PCB traces -->
    <g stroke="#6aad5e" stroke-width="1.5" fill="none" opacity="0.6">
      <path d="M230,140 L350,140 L350,180 L420,180"/>
      <path d="M230,160 L300,160 L300,200 L380,200"/>
      <path d="M350,140 L350,120 L450,120 L450,160"/>
      <path d="M420,180 L480,180 L480,220 L520,220"/>
      <path d="M300,200 L300,240 L400,240"/>
      <path d="M380,200 L520,200"/>
      <path d="M230,220 L280,220 L280,260 L350,260"/>
      <path d="M450,160 L450,240 L520,240"/>
    </g>

    <!-- Solder pads -->
    <g fill="#c0a050">
      <circle cx="230" cy="140" r="4"/><circle cx="230" cy="160" r="4"/>
      <circle cx="230" cy="220" r="4"/><circle cx="520" cy="200" r="4"/>
      <circle cx="520" cy="220" r="4"/><circle cx="520" cy="240" r="4"/>
    </g>

    <!-- SDP3x Sensor chip -->
    <rect x="340" y="150" width="100" height="80" rx="4" fill="url(#chip)" stroke="#555" stroke-width="1"/>
    <!-- Chip pins top -->
    <g fill="#c0a050">
      <rect x="355" y="145" width="8" height="10" rx="1"/>
      <rect x="370" y="145" width="8" height="10" rx="1"/>
      <rect x="385" y="145" width="8" height="10" rx="1"/>
      <rect x="400" y="145" width="8" height="10" rx="1"/>
      <rect x="415" y="145" width="8" height="10" rx="1"/>
    </g>
    <!-- Chip pins bottom -->
    <g fill="#c0a050">
      <rect x="355" y="225" width="8" height="10" rx="1"/>
      <rect x="370" y="225" width="8" height="10" rx="1"/>
      <rect x="385" y="225" width="8" height="10" rx="1"/>
      <rect x="400" y="225" width="8" height="10" rx="1"/>
      <rect x="415" y="225" width="8" height="10" rx="1"/>
    </g>
    <!-- Chip label -->
    <text x="390" y="185" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="11" font-weight="bold">SDP3x</text>
    <text x="390" y="200" text-anchor="middle" fill="#888" font-family="monospace" font-size="8">SENSIRION</text>

    <!-- I2C label -->
    <text x="260" y="135" fill="#6aad5e" font-family="monospace" font-size="9" opacity="0.8">I2C</text>

    <!-- Pressure ports -->
    <g fill="#888" stroke="#666" stroke-width="1">
      <rect x="440" y="170" width="20" height="12" rx="2"/>
      <rect x="440" y="198" width="20" height="12" rx="2"/>
    </g>
    <text x="470" y="180" fill="#aaa" font-family="monospace" font-size="7">P+</text>
    <text x="470" y="208" fill="#aaa" font-family="monospace" font-size="7">P-</text>

    <!-- Pressure arrows -->
    <g stroke="#00d4ff" stroke-width="1.5" fill="none" filter="url(#glow)" opacity="0.7">
      <path d="M480,176 L510,176"/>
      <path d="M505,172 L510,176 L505,180"/>
      <path d="M510,204 L480,204"/>
      <path d="M485,200 L480,204 L485,208"/>
    </g>
  </g>

  <!-- Arduino board (simplified) -->
  <g filter="url(#shadow)" transform="translate(50, 130)">
    <rect x="0" y="0" width="100" height="140" rx="6" fill="#0063a5" stroke="#004a80" stroke-width="2"/>
    <!-- USB port -->
    <rect x="30" y="-8" width="40" height="12" rx="2" fill="#ccc" stroke="#999" stroke-width="1"/>
    <!-- Header pins -->
    <g fill="#333">
      <rect x="8" y="15" width="6" height="4" rx="1"/><rect x="16" y="15" width="6" height="4" rx="1"/>
      <rect x="24" y="15" width="6" height="4" rx="1"/><rect x="32" y="15" width="6" height="4" rx="1"/>
      <rect x="8" y="25" width="6" height="4" rx="1"/><rect x="16" y="25" width="6" height="4" rx="1"/>
      <rect x="24" y="25" width="6" height="4" rx="1"/><rect x="32" y="25" width="6" height="4" rx="1"/>
    </g>
    <!-- Board label -->
    <text x="50" y="80" text-anchor="middle" fill="#fff" font-family="monospace" font-size="10" font-weight="bold">Arduino</text>
    <text x="50" y="95" text-anchor="middle" fill="#cce" font-family="monospace" font-size="7">UNO</text>
    <!-- I2C wires -->
    <g stroke="#ff6b6b" stroke-width="2" fill="none">
      <path d="M55,15 Q70,15 80,30 Q90,45 100,50"/>
    </g>
    <g stroke="#4ecdc4" stroke-width="2" fill="none">
      <path d="M63,15 Q78,15 88,30 Q98,45 108,50"/>
    </g>
  </g>

  <!-- I2C connection lines -->
  <g stroke-width="2" fill="none" opacity="0.8">
    <path d="M158,180 Q180,180 200,180" stroke="#ff6b6b" stroke-dasharray="4,3"/>
    <path d="M166,180 Q185,180 200,185" stroke="#4ecdc4" stroke-dasharray="4,3"/>
  </g>

  <!-- Signal waves from sensor -->
  <g stroke="#00d4ff" stroke-width="1" fill="none" opacity="0.3">
    <path d="M540,190 Q560,170 580,190 Q600,210 620,190"/>
    <path d="M555,190 Q575,175 595,190 Q615,205 635,190"/>
    <path d="M570,190 Q590,180 610,190"/>
  </g>

  <!-- Title -->
  <text x="400" y="370" text-anchor="middle" fill="#fff" font-family="'Source Sans Pro', sans-serif" font-size="24" font-weight="600" opacity="0.9">Sensirion SDP3x</text>
  <text x="400" y="392" text-anchor="middle" fill="#00d4ff" font-family="'Source Sans Pro', sans-serif" font-size="13" opacity="0.7">Differential Pressure Sensor | Arduino I2C Driver</text>
</svg>
